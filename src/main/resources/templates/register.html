
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - BloodConnect</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .register-container {
            max-width: 550px;
            margin: 45px auto;
            padding: 30px;
            background: #fff5f5;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .register-container h2 {
            text-align: center;
            color: #c62828;
            margin-bottom: 25px;
        }

        .register-container label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-container input,
        .register-container select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .register-container button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>Create Your Account</h2>

        <p class="success" th:if="${success}" th:text="${success}"></p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <label>Full Name</label>
            <input type="text" th:field="*{fullName}"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" th:field="*{email}"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" th:field="*{password}"
                   placeholder="Create a password"
                   minlength="8" required>

            <label>Select Role</label>
            <select th:field="*{role}" required>
                <option value="">Select your role</option>
                <option value="DONOR">Donor</option>
                <option value="RECIPIENT">Recipient</option>
            </select>

            <label>Blood Group</label>
            <select th:field="*{bloodGroup}">
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <label>Location</label>
            <input type="text" th:field="*{location}"
                   placeholder="Enter your city or area">

            <button type="submit">Register</button>

        </form>

        <div class="back-link">
            <p>Already have an account?
                <a href="/login">Login here</a>
            </p>

            <p><a href="/">Back to Home</a></p>
        </div>

    </div>

</body>
</html>
