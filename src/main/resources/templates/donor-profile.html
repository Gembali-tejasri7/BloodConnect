
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Profile - BloodConnect</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .profile-container {
            max-width: 550px;
            margin: 50px auto;
            padding: 30px;
            background: #fff5f5;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .profile-container h2 {
            text-align: center;
            color: #c62828;
            margin-bottom: 25px;
        }

        .profile-container label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        .profile-container input,
        .profile-container select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .availability {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .availability input {
            width: auto;
        }

        .profile-container button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .success {
            color: green;
            text-align: center;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <h2>My Donor Profile</h2>

        <p class="success"
           th:if="${success}"
           th:text="${success}"></p>

        <p class="error"
           th:if="${error}"
           th:text="${error}"></p>

        <form th:action="@{/donor/profile}"
              th:object="${user}"
              method="post">

            <label>Full Name</label>
            <input type="text"
                   th:value="${user.fullName}"
                   readonly>

            <label>Email</label>
            <input type="email"
                   th:value="${user.email}"
                   readonly>

            <label>Blood Group</label>

            <select th:field="*{bloodGroup}" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <label>Location</label>

            <input type="text"
                   th:field="*{location}"
                   placeholder="Enter your city or area"
                   required>

            <div class="availability">
                <input type="checkbox"
                       name="available"
                       value="true"
                       th:checked="${user.available}">

                <label>Available to donate</label>
            </div>

            <button type="submit">Update Profile</button>

        </form>

        <p style="text-align:center; margin-top:20px;">
            <a href="/dashboard">Back to Dashboard</a>
        </p>

    </div>

</body>
</html>
